<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GasCalendar">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1c2e">
    <title>GasCalendar Focus</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        html, body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
        }
        *, *:before, *:after { box-sizing: border-box; }
        
        /* Barra Superiore Stile Dynamic Island con Sfumatura Fumettosa Pop */
        .header-fixed-notch {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding-top: max(env(safe-area-inset-top, 44px), 40px);
            padding-bottom: 12px;
            transition: all 0.3s ease;
        }

        .header-dark-pop {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.95) 0%, rgba(76, 29, 149, 0.9) 45%, rgba(15, 23, 42, 0.95) 100%);
            border-bottom: 2px solid rgba(244, 63, 94, 0.4);
            box-shadow: 0 10px 30px -10px rgba(124, 58, 237, 0.5);
        }

        .header-light-pop {
            background: linear-gradient(135deg, rgba(254, 240, 138, 0.95) 0%, rgba(251, 146, 60, 0.9) 50%, rgba(244, 63, 94, 0.9) 100%);
            border-bottom: 2px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 10px 30px -10px rgba(251, 146, 60, 0.4);
        }

        .content-spacer {
            height: calc(max(env(safe-area-inset-top, 44px), 40px) + 72px);
        }

        .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom, 20px), 24px); }
        .card-pop { transition: transform 0.2s ease; }
        .card-pop:active { transform: scale(0.98); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .animate-slide-up { animation: none; } }
    </style>
</head>
<body id="bodyRoot" class="bg-[#1a1c2e] text-white min-h-screen flex flex-col">

    <!-- Barra Superiore Dynamic Island Fissa -->
    <div id="headerContainer" class="header-fixed-notch header-dark-pop w-full px-4 md:px-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-2 w-full">
            <div class="flex items-center gap-2.5 shrink-0 min-w-0">
                <div id="appLogoBox" class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/40 shrink-0 font-black text-xl border border-white/20">
                    <i data-lucide="calendar" class="text-white w-5 h-5"></i>
                </div>
                <div class="flex flex-col leading-tight min-w-0">
                    <h1 class="text-base font-black tracking-tight truncate drop-shadow">GasCalendar</h1>
                    <span id="appFocusTag" class="text-xs font-black uppercase tracking-wider text-amber-300 drop-shadow">Focus ✨</span>
                </div>
                
                <!-- Widget Meteo Interattivo -->
                <div class="relative ml-1 shrink-0">
                    <button onclick="toggleWeatherMenu()" id="weatherBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-black/40 border border-white/20 text-xs font-bold hover:bg-black/60 transition-all shadow-md">
                        <i data-lucide="cloud-sun" class="w-4 h-4 text-amber-400 shrink-0 animate-pulse" id="weatherIcon"></i>
                        <span id="weatherTemp" class="text-white font-black">--°C</span>
                    </button>
                    <!-- Menu Previsioni Meteo Esteso a 10 Giorni -->
                    <div id="weatherMenu" class="hidden absolute left-0 mt-3 w-72 max-w-[90vw] rounded-3xl p-4 z-50 border shadow-2xl bg-[#1e1b4b] border-indigo-500/40 text-xs space-y-3 backdrop-blur-xl">
                        <div class="border-b border-white/10 pb-2.5 flex justify-between items-center">
                            <div class="min-w-0 pr-2">
                                <span class="font-black text-sm block text-amber-300">Previsioni 10 Giorni ☀️</span>
                                <span id="weatherLocationName" class="text-[10px] text-indigo-200 font-medium truncate block">Rilevamento posizione...</span>
                            </div>
                            <i data-lucide="map-pin" class="w-4 h-4 text-rose-400 shrink-0"></i>
                        </div>
                        <div id="weatherForecastList" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                            <div class="text-center opacity-50 py-3">Caricamento previsioni meteo...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gruppo Pulsanti (Destra) -->
            <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
                <button id="themeToggle" aria-label="Cambia tema" class="p-2.5 rounded-2xl bg-black/30 border border-white/15 text-amber-300 hover:bg-black/50 transition-colors shrink-0 shadow-md">
                    <i data-lucide="sun" class="w-4 h-4"></i>
                </button>

                <button id="refreshBtn" aria-label="Aggiorna" class="p-2.5 rounded-2xl bg-black/30 border border-white/15 text-white hover:bg-black/50 transition-colors shrink-0 shadow-md">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>

                <!-- Campanella Promemoria -->
                <div class="relative shrink-0">
                    <button id="alarmBtn" onclick="toggleAlarmMenu()" class="p-2.5 rounded-2xl bg-black/30 border border-white/15 text-white hover:bg-black/50 transition-colors relative shadow-md" title="Imposta Promemoria">
                        <i data-lucide="bell" class="w-4 h-4" id="bellIcon"></i>
                        <span id="alarmBadge" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-indigo-950"></span>
                    </button>
                    <div id="alarmMenu" class="hidden absolute right-0 mt-3 w-64 max-w-[90vw] rounded-3xl p-4 z-50 border shadow-2xl bg-[#1e1b4b] border-indigo-500/40 text-sm space-y-3 backdrop-blur-xl">
                        <div class="font-bold border-b border-white/10 pb-2 flex justify-between items-center text-amber-300">
                            <span>Promemoria & Avvisi</span>
                            <i data-lucide="bell-ring" class="w-4 h-4 text-amber-400"></i>
                        </div>
                        <div>
                            <label class="block text-xs opacity-70 mb-1">Anticipo avviso:</label>
                            <select id="alarmOffset" onchange="saveAlarmSettings()" class="w-full bg-slate-900 border border-white/20 rounded-xl p-2 text-white text-xs focus:outline-none focus:border-indigo-400">
                                <option value="0">Esattamente all'orario</option>
                                <option value="5">5 minuti prima</option>
                                <option value="10" selected>10 minuti prima</option>
                                <option value="15">15 minuti prima</option>
                                <option value="30">30 minuti prima</option>
                                <option value="60">1 ora prima</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between pt-1">
                            <span>Attiva suoni</span>
                            <input type="checkbox" id="alarmSound" checked onchange="saveAlarmSettings()" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                        </div>
                        <button onclick="requestNotificationPermission()" class="w-full py-2 bg-gradient-to-r from-indigo-600 to-rose-600 text-white rounded-xl text-xs font-bold shadow-lg transition-all">
                            Abilita Notifiche Telefono
                        </button>
                    </div>
                </div>

                <!-- Menu Liste -->
                <div class="relative shrink-0">
                    <button id="listBtn" onclick="toggleMenu()" class="flex items-center gap-1.5 px-3.5 py-2 md:px-4 md:py-2 rounded-2xl font-bold transition-all bg-black/30 border border-white/15 text-white hover:bg-black/50 text-sm shadow-md">
                        <i data-lucide="list-todo" class="w-4 h-4 shrink-0 text-amber-300"></i>
                        <span id="listLabel" class="hidden sm:inline">Liste</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 transition-transform shrink-0" id="chevron"></i>
                    </button>
                    <div id="listMenu" class="hidden absolute right-0 mt-3 w-48 max-w-[90vw] rounded-3xl p-2 z-50 border shadow-2xl bg-[#1e1b4b] border-indigo-500/40 backdrop-blur-xl">
                        <button onclick="openList('todo')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-colors text-left hover:bg-indigo-600/30 text-white font-medium">
                            <i data-lucide="list-todo" class="w-4 h-4 text-indigo-400 shrink-0"></i> Cose da fare
                        </button>
                        <button onclick="openList('shopping')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-colors text-left hover:bg-indigo-600/30 text-white font-medium">
                            <i data-lucide="shopping-cart" class="w-4 h-4 text-emerald-400 shrink-0"></i> Lista Spesa
                        </button>
                        <button onclick="openList('notes')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-colors text-left hover:bg-indigo-600/30 text-white font-medium">
                            <i data-lucide="sticky-note" class="w-4 h-4 text-amber-400 shrink-0"></i> Note Rapide
                        </button>
                        <button onclick="toggleMenu()" class="w-full text-center mt-2 py-1.5 text-xs text-indigo-300 hover:text-white transition-colors">Chiudi</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spaziatore dinamico -->
    <div class="content-spacer"></div>

    <!-- Contenuto Principale Scorrevole -->
    <div class="flex-1 p-4 md:p-8 safe-bottom max-w-4xl mx-auto w-full overflow-x-hidden space-y-8">
        <div class="space-y-3">
            <h2 id="greeting" class="text-4xl md:text-6xl font-black tracking-tight break-words">Caricamento...</h2>
            <!-- Commento spiritoso dinamico -->
            <p id="funnyJoke" class="text-sm md:text-base font-semibold text-amber-400 italic opacity-90"></p>
            <div class="flex items-center gap-2 text-lg font-semibold opacity-90 pt-1">
                <i data-lucide="calendar" class="text-amber-400 w-5 h-5 shrink-0" id="dateCalendarIcon"></i>
                <span id="currentDate" class="truncate"></span>
            </div>
            <p id="statusLine" class="hidden text-sm opacity-60"></p>
        </div>

        <div id="statusCard" class="hidden"></div>

        <!-- Modal Pop-up Notifica Evento in arrivo -->
        <div id="alarmPopup" class="hidden p-5 rounded-3xl border-2 bg-indigo-950/95 border-amber-500 shadow-2xl flex items-center justify-between animate-pulse gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="p-3 bg-amber-500 rounded-2xl text-slate-950 shrink-0 font-bold">
                    <i data-lucide="bell-ring" class="w-6 h-6"></i>
                </div>
                <div class="min-w-0">
                    <p class="text-xs uppercase font-black text-amber-400 tracking-wider">Promemoria Evento</p>
                    <h4 id="alarmPopupTitle" class="text-lg font-bold truncate">Titolo Evento</h4>
                </div>
            </div>
            <button onclick="dismissAlarmPopup()" class="px-4 py-2 bg-amber-500 text-slate-950 rounded-xl text-sm font-black hover:bg-amber-400 transition-colors shrink-0 shadow-lg">
                Ho capito
            </button>
        </div>

        <div id="todayFocus" class="space-y-4">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div id="todayBar" class="h-1.5 w-8 bg-amber-400 rounded-full shrink-0"></div>
                    <span id="todayTitleText" class="text-sm font-black uppercase tracking-widest text-amber-400">Appuntamenti di Oggi</span>
                </div>
                <button onclick="openAddEventModal(romeToday())" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-xs font-black transition-colors border border-amber-500/30">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Aggiungi
                </button>
            </div>
            <div id="todayEventsList" class="grid grid-cols-1 gap-3"></div>
        </div>

        <div class="space-y-4">
            <div class="flex items-center gap-2 mb-2">
                <div class="h-1.5 w-8 bg-indigo-400 rounded-full shrink-0"></div>
                <span class="text-sm font-black uppercase tracking-widest opacity-80">Prossimi 6 Giorni</span>
            </div>
            <div id="calendarGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <!-- Modal Aggiungi Evento a Data Specifica -->
    <div id="addEventModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
        <div class="w-full max-w-md rounded-3xl overflow-hidden bg-[#1e1b4b] border border-indigo-500/40 shadow-2xl p-6 space-y-4 animate-slide-up text-white">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="text-lg font-black flex items-center gap-2 text-amber-300">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-amber-400"></i> Aggiungi Impegno
                </h3>
                <button onclick="closeAddEventModal()" class="p-1.5 hover:bg-white/10 rounded-full transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs opacity-70 mb-1 font-semibold">Data selezionata:</label>
                    <input type="date" id="modalEventDate" class="w-full bg-slate-900 border border-white/20 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400 font-medium">
                </div>
                <div>
                    <label class="block text-xs opacity-70 mb-1 font-semibold">Titolo impegno / promemoria:</label>
                    <input type="text" id="modalEventTitle" placeholder="Es. Visita medica, Riunione..." class="w-full bg-slate-900 border border-white/20 rounded-xl p-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-400 font-medium" onkeypress="if(event.key==='Enter') submitAddEventModal()">
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeAddEventModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-semibold transition-colors">Annulla</button>
                    <button onclick="submitAddEventModal()" class="flex-1 py-2.5 bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-400 hover:to-rose-400 text-slate-950 rounded-xl text-sm font-black shadow-lg transition-all">Salva</button>
                </div>
            </div>
        </div>
    </div>

    <!-- List Overlay -->
    <div id="listOverlay" class="fixed inset-0 z-[100] hidden flex items-end md:items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
        <div id="listCard" class="w-full max-w-lg rounded-t-3xl md:rounded-3xl overflow-hidden bg-[#1e1b4b] border border-indigo-500/40 shadow-2xl animate-slide-up">
            <div class="p-5 flex justify-between items-center border-b border-white/10">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="listIconBox" class="p-2.5 bg-gradient-to-br from-amber-400 to-rose-500 rounded-2xl text-slate-950 shrink-0 font-black"></div>
                    <h3 id="listTitle" class="text-xl font-black capitalize truncate text-amber-300">Lista</h3>
                </div>
                <button onclick="closeList()" class="p-2 hover:bg-white/10 rounded-full transition-colors shrink-0">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4">
                <div id="listItems" class="space-y-2 max-h-[50vh] overflow-y-auto pr-1"></div>
                <div class="flex gap-2 pt-2">
                    <input type="text" id="newItemInput" placeholder="Aggiungi una voce..." 
                        class="flex-1 bg-slate-900 border border-white/20 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 text-white placeholder-slate-400 min-w-0 font-medium"
                        onkeypress="if(event.key==='Enter') addItemToCloud()">
                    <button onclick="addItemToCloud()" class="px-5 py-3 bg-gradient-to-r from-amber-400 to-rose-500 text-slate-950 rounded-2xl font-black hover:opacity-90 transition-all flex items-center gap-2 shadow-lg shrink-0">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://gascalfocus.allarme-miacasa.workers.dev/";
        const WORKER_KEY = "";

        const TZ = "Europe/Rome";
        const CACHE_KEY = "gascalendar:ultimo-aggiornamento";
        const REFRESH_MS = 5 * 60 * 1000;
        const TICK_MS = 60 * 1000;

        let isDark = true;
        let weekData = null;
        let sharedLists = { todo: [], shopping: [], notes: [] };
        let weatherForecast = {};
        let rawDailyData = null;
        let loadState = "loading";
        let loading = false;
        let currentListType = "todo";

        let alarmSettings = JSON.parse(localStorage.getItem("gas_alarm_settings") || '{"offset":10,"sound":true}');
        let notifiedEvents = new Set();

        const badgeColors = [
            "bg-rose-500 text-white", "bg-amber-500 text-slate-950", "bg-emerald-500 text-slate-950",
            "bg-sky-500 text-slate-950", "bg-indigo-500 text-white", "bg-violet-500 text-white", "bg-fuchsia-500 text-white"
        ];

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function romeToday() {
            return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
        }

        function romeHour(now) {
            return Number(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", hourCycle: "h23" }).format(now)) % 24;
        }

        function romeTime(ms) {
            return new Intl.DateTimeFormat("it-IT", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(ms));
        }

        function dayDiff(fromIso, toIso) {
            return Math.round((Date.parse(toIso + "T00:00:00Z") - Date.parse(fromIso + "T00:00:00Z")) / 86400000);
        }

        function isoToDate(iso) { return new Date(iso + "T12:00:00Z"); }

        function openAddEventModal(dateIso) {
            document.getElementById("modalEventDate").value = dateIso || romeToday();
            document.getElementById("modalEventTitle").value = "";
            document.getElementById("addEventModal").classList.remove("hidden");
            document.getElementById("modalEventTitle").focus();
        }

        function closeAddEventModal() {
            document.getElementById("addEventModal").classList.add("hidden");
        }

        async function submitAddEventModal() {
            const dateVal = document.getElementById("modalEventDate").value;
            const titleVal = document.getElementById("modalEventTitle").value.trim();
            if (!dateVal || !titleVal) return;

            try {
                const res = await fetch(`${WORKER_URL}?action=addCalendarEvent`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ date: dateVal, title: titleVal })
                });
                if (!res.ok) throw new Error("Errore salvataggio evento");
                closeAddEventModal();
                await loadWeek();
            } catch (err) {
                alert("Impossibile aggiungere l'impegno. Verifica la connessione.");
            }
        }

        function initWeather() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        try {
                            const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`, {
                                headers: { 'User-Agent': 'GasCalendarFocus/1.0' }
                            });
                            const geoData = await geoRes.json();
                            if (geoData && geoData.address) {
                                const city = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.municipality || geoData.address.county || "Posizione attuale";
                                const country = geoData.address.country || "";
                                document.getElementById("weatherLocationName").innerText = `${city}${country ? ', ' + country : ''}`;
                            }
                        } catch (e) {
                            document.getElementById("weatherLocationName").innerText = "Posizione GPS rilevata";
                        }

                        try {
                            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
                            const data = await res.json();
                            
                            if (data && data.current_weather) {
                                updateWeatherUI(data.current_weather.temperature, data.current_weather.weathercode, data.current_weather.is_day);
                            }

                            if (data && data.daily && data.daily.time) {
                                rawDailyData = data.daily;
                                for (let i = 0; i < data.daily.time.length; i++) {
                                    const maxVal = data.daily.temperature_2m_max && data.daily.temperature_2m_max[i] !== undefined ? Math.round(data.daily.temperature_2m_max[i]) : null;
                                    const minVal = data.daily.temperature_2m_min && data.daily.temperature_2m_min[i] !== undefined ? Math.round(data.daily.temperature_2m_min[i]) : null;
                                    
                                    weatherForecast[data.daily.time[i]] = {
                                        code: data.daily.weathercode ? data.daily.weathercode[i] : 0,
                                        max: maxVal,
                                        min: minVal
                                    };
                                }
                                buildWeatherMenuDropdown();
                                renderAll();
                            }
                        } catch (e) {
                            console.log("Errore caricamento meteo:", e);
                        }
                    },
                    (err) => {
                        document.getElementById("weatherLocationName").innerText = "Geolocalizzazione disattivata";
                    }
                );
            }
        }

        function getWeatherDetails(code, isDay = 1) {
            let iconName = "sun";
            let iconColor = "text-amber-400";
            let label = "Sereno";

            if (code === 0) {
                iconName = isDay === 1 ? "sun" : "moon-star";
                iconColor = isDay === 1 ? "text-amber-400" : "text-indigo-300";
                label = isDay === 1 ? "Sereno" : "Notte serena";
            } else if (code >= 1 && code <= 3) {
                iconName = isDay === 1 ? "cloud-sun" : "cloud-moon";
                iconColor = "text-amber-200";
                label = "Nuvoloso";
            } else if (code >= 51 && code <= 67) {
                iconName = "cloud-rain";
                iconColor = "text-sky-400";
                label = "Pioggia";
            } else if (code >= 80 && code <= 82) {
                iconName = "cloud-drizzle";
                iconColor = "text-blue-400";
                label = "Rovesci";
            } else if (code >= 95) {
                iconName = "cloud-lightning";
                iconColor = "text-amber-500";
                label = "Temporale";

        function playChimeSound() {
            if (!alarmSettings.sound) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch (e) {}
        }

        function checkUpcomingEvents() {
            if (!weekData || !weekData.days) return;
            const now = Date.now();
            const today = romeToday();
            const todayData = weekData.days.find(d => d.date === today);
            if (!todayData || !todayData.events) return;

            const offsetMs = alarmSettings.offset * 60 * 1000;

            todayData.events.forEach(e => {
                if (e.allDay || !e.startMs) return;
                const timeDiff = e.startMs - now;
                if (timeDiff >= 0 && timeDiff <= offsetMs && !notifiedEvents.has(e.id)) {
                    notifiedEvents.add(e.id);
                    triggerAlarm(e.title, e.time);
                }
            });
        }

        async function addItemToCloud() {
            const input = document.getElementById("newItemInput");
            const text = input.value.trim();
            if (!text) return;

            input.disabled = true;
            try {
                const res = await fetch(`${WORKER_URL}?action=addItem`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title: text, listType: currentListType })
                });
                if (!res.ok) throw new Error("Errore salvataggio");
                input.value = "";
                await loadWeek();
                renderListItems();
            } catch (err) {
                alert("Impossibile aggiungere l'elemento. Verifica la connessione.");
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        async function loadWeek() {
            if (loading) return;
            loading = true;
            setSpinning(true);
            try {
                const url = new URL(WORKER_URL);
                if (WORKER_KEY) url.searchParams.set("k", WORKER_KEY);
                const res = await fetch(url.toString(), { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                if (!data || !Array.isArray(data.days)) throw new Error("risposta non valida");
                weekData = data;
                if (data.lists) sharedLists = data.lists;
                loadState = "ok";
                try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
            } catch (e) {
                loadState = weekData ? "stale" : "error";
            } finally {
                loading = false;
                setSpinning(false);
                renderAll();
                if (!document.getElementById("listOverlay").classList.contains("hidden")) {
                    renderListItems();
                }
            }
        }

                    : '<div class="py-3 text-center opacity-40 italic text-xs font-semibold">Giornata libera ✨</div>';

                grid.innerHTML += `
                    <div class="p-5 rounded-3xl border transition-all card-pop ${cardBg} space-y-4 w-full shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-12 h-12 rounded-2xl flex flex-col items-center justify-center font-black shadow-lg ${badgeColors[i % badgeColors.length]} shrink-0">
                                    <span class="text-[10px] uppercase leading-none opacity-90">${esc(dayName)}</span>
                                    <span class="text-lg leading-none">${dayNum}</span>
                                </div>
                                <div class="min-w-0">
                                    <h4 class="font-black text-lg capitalize truncate text-white">${esc(fullDayName)}</h4>
                                    <span class="text-xs opacity-70 truncate block font-semibold">${relLabel} • ${countLabel}</span>
                                </div>
                            </div>
                            <button onclick="openAddEventModal('${day.date}')" class="p-2.5 rounded-2xl bg-gradient-to-br from-amber-400 to-rose-500 text-slate-950 hover:opacity-90 transition-all shrink-0 shadow-md font-bold" title="Aggiungi impegno in questo giorno">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                        ${weatherHtml}
                        <div class="space-y-2">${eventsHtml}</div>
                    </div>`;
            });

            lucide.createIcons();
        }

        function tick() {
            updateGreeting();
            checkUpcomingEvents();
            if (weekData && weekData.days[0].date !== romeToday()) {
                loadWeek();
            } else {
                renderAll();
            }
        }

        document.getElementById("themeToggle").onclick = toggleTheme;
        document.getElementById("refreshBtn").onclick = loadWeek;

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") { updateGreeting(); loadWeek(); }
        });

        updateGreeting();
        updateAlarmBadge();
        initWeather();
        const cached = readCache();
        if (cached) weekData = cached;
        renderAll();
        lucide.createIcons();
        loadWeek();
        setInterval(tick, TICK_MS);
        setInterval(loadWeek, REFRESH_MS);
    </script>
</body>
</html>
